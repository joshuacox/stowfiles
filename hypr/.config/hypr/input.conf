input {
  kb_layout = us
  kb_options = compose:caps
  repeat_rate = 40
  repeat_delay = 250
  numlock_by_default = true
  follow_mouse = 1
  
  touchpad {
    natural_scroll = true
    clickfinger_behavior = true
    scroll_factor = 0.4
    tap-to-click = true
    disable_while_typing = true
  }
}

cursor {
    no_hardware_cursors = true
}

